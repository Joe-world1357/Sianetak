name: Android APK

# Analyzes and tests the app, builds the release APK with the Gradle wrapper (via flutter build),
# checks it installs and launches on an emulator, and, for pushes to main, publishes it as
# Sianetak.apk on the "sianetak-apk" release for direct download. Other branches keep the APK
# as a workflow artifact only.
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Verify APK
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$tools/aapt2" dump badging "$apk" | head -3
          "$tools/apksigner" verify --print-certs "$apk" | head -2
          cp "$apk" ../Sianetak.apk
          ls -l ../Sianetak.apk
          sha256sum ../Sianetak.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sianetak
          path: Sianetak.apk

  install-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sianetak
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r Sianetak.apk
            adb shell monkey -p eg.sianetak.sianetak_customer -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof eg.sianetak.sianetak_customer
            adb exec-out screencap -p > launch.png
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-launch-screenshot
          path: launch.png

  publish:
    needs: install-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Sianetak
      - name: Publish to the sianetak-apk release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Release build of main at ${GITHUB_SHA::7}. Download Sianetak.apk on your phone and open it to install. If an older build is installed, uninstall it first (each build is signed by the CI runner's key)."
          if gh release view sianetak-apk >/dev/null 2>&1; then
            gh release edit sianetak-apk --target "$GITHUB_SHA" --notes "$notes"
          else
            gh release create sianetak-apk --latest --target "$GITHUB_SHA" --title "Sianetak 1.0 (Android APK)" --notes "$notes"
          fi
          gh release upload sianetak-apk Sianetak.apk --clobber
